<!doctype html>
<html lang="vi">
<head>

<title>Quản Lý Bóng Đá</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&amp;family=Oswald:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b16;--panel:#0e1526;--panel2:#141d36;--line:#22305a;--gold:#e6c25a;--ink:#e9edf7;--mute:#8b97b5;--green:#1f9d57;--red:#e0405a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{background:radial-gradient(1100px 480px at 75% -10%,#15275a,transparent),var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
.num,h1,h2,h3,.ov,.vsx{font-family:Oswald,'Arial Narrow',Impact,sans-serif}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:14px}
button,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--gold)}button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.btn.gold{background:linear-gradient(#f2d36e,#c79a22);color:#241a06;border:0;font-weight:700;letter-spacing:.03em}
.btn.big{width:100%;padding:13px;font:700 1.15rem Oswald,sans-serif;margin-top:10px}
.logo{font:700 2.2rem/1 Oswald,Impact,sans-serif;letter-spacing:.06em;margin:.4em 0 .1em}.logo span{color:var(--gold)}
.sub{color:var(--mute);margin:0 0 14px}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.club{display:grid;justify-items:center;gap:2px;padding:14px 8px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.club .num{font-size:1.6rem;color:var(--gold)}.club small{color:var(--mute)}
.bdg{display:inline-grid;place-items:center;font-family:Oswald,sans-serif;font-weight:700;color:#fff;text-shadow:0 1px 2px #000b;background:linear-gradient(150deg,var(--a),var(--b));border:2px solid #fff8;border-radius:30% 30% 50% 50%/20% 20% 60% 60%;flex:none}
.top{display:flex;align-items:center;gap:12px}.top h2{margin:0;font-size:1.5rem}.top small{color:var(--mute)}.bud{margin-left:auto;font-size:1.4rem;color:var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}.tabs button{white-space:nowrap}.tabs .on{background:var(--gold);color:#241a06;border-color:var(--gold);font-weight:600}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 8px;font-size:1.1rem;letter-spacing:.04em}
.vs{display:flex;align-items:center;justify-content:space-around;gap:6px;margin:8px 0}.vs>div{display:grid;justify-items:center;gap:3px;text-align:center}.vs .num{font-size:1.6rem;color:var(--gold)}.vsx{font-size:1.8rem;color:var(--mute)}
.f{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;margin-right:5px;font:700 12px Oswald;font-style:normal;color:#fff}.f.w{background:var(--green)}.f.d{background:#8a8f9c}.f.l{background:var(--red)}
.lrow{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #ffffff10}.lrow .num{margin-left:auto}.lrow.me{color:var(--gold)}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}.tb th{color:var(--mute);font-weight:600;text-align:center;padding:5px 3px}.tb td{padding:6px 3px;text-align:center;border-top:1px solid #ffffff10}.tb td:nth-child(2){text-align:left}.tb tr.me td{color:var(--gold);font-weight:600}
.st2 td{padding:7px}.st2 td:nth-child(2){text-align:center;color:var(--mute)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;margin-bottom:10px}.ctrls label{font-size:.8rem;color:var(--mute);display:grid;gap:3px}
.hint{color:var(--mute);font-size:.85rem;margin:6px 0 10px}
.pitch{position:relative;width:100%;max-width:430px;margin:0 auto 12px;aspect-ratio:2/2.7;border-radius:12px;background:repeating-linear-gradient(180deg,#1c7a43 0 9%,#1f8a4b 9% 18%);border:2px solid #ffffff55;overflow:hidden}
.pitch::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff55}
.slot{position:absolute;transform:translate(-50%,50%);width:68px;text-align:center;border:0;background:none;padding:0;color:#fff;font:600 11px 'Be Vietnam Pro',sans-serif;text-shadow:0 1px 3px #000}
.slot i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 2px;border-radius:50%;font:700 17px Oswald;font-style:normal;color:#1a1305;background:linear-gradient(#f6dc7d,#b98a1d);border:2px solid #fff}
.slot.sel i{outline:3px solid #4fd1ff}.slot.bad i{background:linear-gradient(#ffb36b,#d56a1a)}
.list{display:grid;gap:5px}.row{display:grid;grid-template-columns:34px 1fr auto 36px 52px;gap:8px;align-items:center;text-align:left;padding:7px 10px}

.mrow{display:grid;grid-template-columns:34px 1fr 36px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #ffffff10}.mrow small{color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;justify-items:center}
.card{width:128px;height:178px;border-radius:12px 12px 24px 24px/12px 12px 32px 32px;position:relative;overflow:hidden;background:linear-gradient(155deg,var(--c1),var(--c2));color:#241a06;box-shadow:0 8px 20px #0009,inset 0 0 0 2px #fff6}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff55 48%,transparent 60%);pointer-events:none}
.card.gold{--c1:#f6dc7d;--c2:#b98a1d}.card.silver{--c1:#eef1f5;--c2:#8f9aa6}.card.bronze{--c1:#e5b07c;--c2:#8b5a2b}.card.elite{--c1:#3a2f63;--c2:#0b0a14;color:#f0d98a}
.card .cl{position:absolute;left:8px;top:8px;display:grid;gap:2px;justify-items:center;line-height:1}.card .ov{font-size:30px;font-weight:700}.card .cl span{font:600 11px Oswald}
.card .fc{position:absolute;right:6px;top:6px;width:78px;line-height:0}
.card .nm{position:absolute;left:4px;right:4px;top:100px;text-align:center;font:700 14px Oswald;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #0003;padding-top:2px}
.card .st{position:absolute;left:10px;right:10px;bottom:13px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px 4px;font-size:9.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:9px 16px;border-radius:20px;z-index:50}
#mv{position:fixed;inset:0;z-index:20;background:radial-gradient(900px 400px at 50% 0,#15275a,transparent),var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.mvw{max-width:900px;margin:0 auto;padding:10px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:8px}.tm{display:flex;align-items:center;gap:8px}.tm.r{justify-content:flex-end;text-align:right}
.sc{text-align:center}.sc b{display:block;font:700 2rem/1 Oswald;letter-spacing:.08em}.sc small{color:var(--gold);font:600 1rem Oswald}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.stage canvas{display:block;width:100%;aspect-ratio:105/68}
#flash{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(1.6rem,7vw,3rem) Oswald;color:#fff;text-shadow:0 0 20px var(--gold),0 3px 0 #000;background:#0005;pointer-events:none}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.ctl .on{background:var(--gold);color:#241a06;border-color:var(--gold)}.ctl .sep{flex:1}
#now{min-height:1.5em;color:var(--mute);font-size:.9rem;margin-bottom:6px}
#feed{max-height:200px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}#feed p{margin:0 0 5px;font-size:.9rem;color:var(--mute)}#feed p.imp{color:var(--ink);font-weight:600}
#mvend{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--gold);border-radius:12px;padding:14px;margin-top:10px}#mvend h3{margin:0 0 10px;font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    if (e.k === 'shot' && e.res === 'goal') { MV.score[e.t]++; feed(e.text, true); }
    else if (e.k === 'foul' && e.res !== 'none') feed(e.text, true);
    else if (e.k === 'ht') { feed(e.text, true); MV.playing = false; MV.gt = 45; showHT(); return; }
    else if (e.k === 'ft') { feed(e.text, true); MV.gt = 90; finish(); return; }
    MV.gt = e.at;
  }
}
function commit() {
  const m = MV.m, h = MV.T[0].i, a = MV.T[1].i;
  recordResult(G, h, a, m.sc[0], m.sc[1]); G.res.push({ h, a, gh: m.sc[0], ga: m.sc[1] }); G.last = [{ h, a, gh: m.sc[0], ga: m.sc[1] }];
  G.fx[G.round].forEach(([x, y]) => { if (x === h && y === a) return; const M = newMatch(buildTeam(x), buildTeam(y)); playMinutes(M, 1, 90, true); recordResult(G, x, y, M.sc[0], M.sc[1]); G.last.push({ h: x, a: y, gh: M.sc[0], ga: M.sc[1] }); });
  const my = MV.u === 0 ? m.sc[0] : m.sc[1], th = MV.u === 0 ? m.sc[1] : m.sc[0];
  G.budget = Math.round((G.budget + .5 + (my > th ? .5 : my === th ? .2 : 0)) * 10) / 10; G.round++; G.market = genMarket(); save();
  MV.run = false; $('mv').classList.add('hidden'); tab = 'home'; renderHub();
}
$('mv').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !MV) return;
  if (t.id === 'pp') { if (!$('mvend').classList.contains('hidden')) return; MV.playing = !MV.playing; t.textContent = MV.playing ? '⏸' : '▶'; }
  else if (t.dataset.sp) { MV.speed = +t.dataset.sp; document.querySelectorAll('[data-sp]').forEach(b => b.classList.toggle('on', b === t)); }
  else if (t.id === 'skip') fastForward();
  else if (t.id === 'v2') setView('2d'); else if (t.id === 'v3') setView('3d');
  else if (t.dataset.h === 'sub') {
    const T = MV.T[MV.u], i = +$('hOut').value, inId = +$('hIn').value; if (MV.subs >= 3) return toast('Đã dùng hết 3 lượt thay người.');
    const p = T.squad.find(x => x.id === inId); if (!p) return; T.lineup[i] = p; MV.subs++; showHT();
  }
  else if (t.dataset.h === 'go') {
    const T = MV.T[MV.u]; T.ment = +$('hMent').value; T.press = +$('hPress').value; if (T.i === G.me) { G.ment = T.ment; G.press = T.press; }
    playMinutes(MV.m, 46, 90); $('mvend').classList.add('hidden'); MV.playing = true; MV.wait = .5; MV.gt = 45; $('pp').textContent = '⏸';
  }
  else if (t.dataset.h === 'done') commit();
});
/* ---- Khởi động ---- */
W0 = newWorld(); renderStart();
